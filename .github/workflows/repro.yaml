name: Reproduce

on:
  push:
  workflow_dispatch:

jobs:
  repro:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24', '26']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run reproduction
        run: node repro.mjs
        env:
          NODE_EXTRA_CA_CERTS: cert.pem
